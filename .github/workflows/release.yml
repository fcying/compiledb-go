name: release

on:
  pull_request:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check need release
        id: release
        run: |
          release=false
          new_ver=$(grep -Po "v\d+\.\d+\.\d+" cmd/compiledb/main.go)
          cur_ver=$(git describe --abbrev=0 --tags)
          if [[ "$new_ver" != "$cur_ver" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version=$new_ver
            release=true
          else
            version="dev-${new_ver}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check format
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build and smoke test
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/amd64"
          mkdir -p dist
          go build -ldflags "-X main.Version=$VERSION" -o dist/compiledb ./cmd/compiledb
          ./dist/compiledb --help
          mkdir -p dist/smoke
          printf 'int main(void) { return 0; }\n' > dist/smoke/main.c
          printf 'cc -c main.c -o main.o\n' > dist/smoke/build.log
          (cd dist/smoke && ../compiledb --parse build.log)
          grep -F '"file": "main.c"' dist/smoke/compile_commands.json
          rm -rf dist/smoke
          tar cJf dist/compiledb-linux-amd64.txz -C dist compiledb

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/compiledb-linux-amd64.txz
          if-no-files-found: error

  linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build and smoke test
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/arm64"
          mkdir -p dist
          go build -ldflags "-X main.Version=$VERSION" -o dist/compiledb ./cmd/compiledb
          ./dist/compiledb --help
          mkdir -p dist/smoke
          printf 'int main(void) { return 0; }\n' > dist/smoke/main.c
          printf 'cc -c main.c -o main.o\n' > dist/smoke/build.log
          (cd dist/smoke && ../compiledb --parse build.log)
          grep -F '"file": "main.c"' dist/smoke/compile_commands.json
          rm -rf dist/smoke
          tar cJf dist/compiledb-linux-arm64.txz -C dist compiledb

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: dist/compiledb-linux-arm64.txz
          if-no-files-found: error

  windows-amd64:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test Make proxy paths
        run: go test ./internal -run '^TestMakeProxy' -count=1

      - name: Build and smoke test
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "windows/amd64"
          mkdir -p dist
          go build -ldflags "-X main.Version=$VERSION" -o dist/compiledb.exe ./cmd/compiledb
          ./dist/compiledb.exe --help
          mkdir -p dist/smoke
          printf 'int main(void) { return 0; }\n' > dist/smoke/main.c
          printf 'cc -c main.c -o main.o\n' > dist/smoke/build.log
          (cd dist/smoke && ../compiledb.exe --parse build.log)
          grep -F '"file": "main.c"' dist/smoke/compile_commands.json
          rm -rf dist/smoke
          (cd dist && 7z a compiledb-windows-amd64.zip compiledb.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/compiledb-windows-amd64.zip
          if-no-files-found: error

  darwin-arm64:
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build and smoke test
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "darwin/arm64"
          mkdir -p dist
          go build -ldflags "-X main.Version=$VERSION" -o dist/compiledb ./cmd/compiledb
          ./dist/compiledb --help
          mkdir -p dist/smoke
          printf 'int main(void) { return 0; }\n' > dist/smoke/main.c
          printf 'cc -c main.c -o main.o\n' > dist/smoke/build.log
          (cd dist/smoke && ../compiledb --parse build.log)
          grep -F '"file": "main.c"' dist/smoke/compile_commands.json
          rm -rf dist/smoke
          tar cJf dist/compiledb-darwin-arm64.txz -C dist compiledb

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/compiledb-darwin-arm64.txz
          if-no-files-found: error

  release:
    needs: [ prepare, linux-amd64, linux-arm64, windows-amd64, darwin-arm64 ]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build
          merge-multiple: true

      - name: List artifacts
        run: ls -la build

      - name: Delete previous development release
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev -y
          fi

      - name: Release
        if: ${{ needs.prepare.outputs.release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.version }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          artifacts: "build/*"

      - name: Update latest
        uses: ncipollo/release-action@v1
        with:
          tag: dev
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          name: ${{ needs.prepare.outputs.version }}
          prerelease: true
          draft: true
          artifacts: "build/*"
